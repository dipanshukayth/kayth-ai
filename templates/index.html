<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Kayth AI 👻</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>">
<style>
:root{--y:#FFFC00;--card:#151518;--mut:#8e8e93;--ig:linear-gradient(135deg,#8a3ab9 0%,#e1306c 55%,#fcaf45 100%)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{width:100%;max-width:720px;height:100%;height:100dvh;display:flex;flex-direction:column;border-inline:1px solid #151515}

/* header */
header{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;border-bottom:1px solid #1a1a1a}
.story{position:relative;width:46px;height:46px;flex:none}
.ring{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.ring::before{content:"";position:absolute;inset:-50%;background:conic-gradient(#fcaf45,#e1306c,#8a3ab9,#fcaf45)}
.av{position:absolute;inset:3px;border-radius:50%;background:#000;border:2px solid #000;display:grid;place-items:center;font-weight:800;font-size:18px;background:linear-gradient(#111,#000);z-index:1}
.dot{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--y);border:2.5px solid #000;z-index:2}
.who{flex:1;min-width:0}
.who b{display:block;font-size:18px;font-weight:800;letter-spacing:-.3px}
.who small{display:block;font-size:12.5px;color:var(--mut);margin-top:1px}
.who small.on{color:var(--y)}
.hbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#c7c7cc}
.hbtn:active{background:#1c1c1e}
body.busy .ring::before{animation:spin 1.1s linear infinite}

/* chat */
#chat{flex:1;overflow-y:auto;padding:12px 14px 6px;scrollbar-width:thin;scrollbar-color:#222 transparent;overscroll-behavior:contain}
.chip{width:max-content;margin:2px auto 14px;display:flex;align-items:center;gap:7px;font-size:12.5px;color:#b5b5ba;padding:6px 12px;border-radius:99px;background:var(--card)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--y)}
.row{display:flex;margin:5px 0}
.row.user{justify-content:flex-end}
.b{max-width:82%;padding:9px 13px 6px;border-radius:20px;font-size:15.5px;line-height:1.4;word-break:break-word}
.row.ai .b{background:var(--ig);border-bottom-left-radius:6px}
.row.user .b{background:var(--y);color:#000;border-bottom-right-radius:6px}
.t{white-space:pre-wrap}
.meta{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:3px;font-size:11px;opacity:.8;min-height:18px}
.row.ai .meta{opacity:.9}
.spk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;margin-right:auto;background:rgba(0,0,0,.25)}
.spk .i{width:14px;height:14px}
.spk.on{background:#fff;color:#c13584;animation:pulse 1s infinite}
.tk .i{width:16px;height:16px;stroke-width:2.4}
.tk{display:inline-flex;color:rgba(0,0,0,.5)}
.tk.seen{color:#0a66ff}
.typing .b{background:var(--card);display:flex;align-items:center;gap:10px;padding:11px 14px;color:#b5b5ba;font-size:13.5px}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:#b5b5ba;animation:bounce 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

/* input */
footer{display:flex;align-items:center;gap:10px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));position:relative}
.pill{flex:1;position:relative;display:flex;align-items:center;gap:4px;height:48px;padding:0 6px;border-radius:99px;background:var(--card);border:1px solid #232327}
.pill:focus-within{border-color:#3a3a3f}
.pill .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#c7c7cc}
.pill .ic:active{background:#222}
#msg{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:16px;padding:0 6px}
#msg::placeholder{color:#6e6e73}
#msg:focus-visible{outline:0}
#act{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid #232327;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative;transition:background .15s,color .15s}
#act .snd{display:none}
footer.has #act{background:var(--y);color:#000;border-color:var(--y)}
footer.has #act .mic{display:none}
footer.has #act .snd{display:block}
#act.rec{background:#ff2d3d;border-color:#ff2d3d;color:#fff;animation:ripple 1.1s infinite;transform:scale(1.12)}
.recbar{position:absolute;inset:0;border-radius:99px;background:#1d0709;border:1px solid #5a1219;display:none;align-items:center;gap:10px;padding:0 16px;font-size:14px;color:#ffb3b9;overflow:hidden}
.recbar.show{display:flex}
.recbar i{width:11px;height:11px;border-radius:50%;background:#ff2d3d;flex:none;animation:pulse 1s infinite}
.recbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recbar.cancel{background:#222;border-color:#444;color:#ddd}
.recbar.cancel i{background:#888;animation:none}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#2a2a2e;color:#fff;font-size:13.5px;padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}

.prev{position:absolute;left:12px;bottom:100%;display:none;align-items:center;gap:8px;padding:6px;border-radius:16px;background:var(--card);border:1px solid #232327}
.prev.show{display:flex}
.prev img{width:56px;height:56px;object-fit:cover;border-radius:10px}
.prev button{width:26px;height:26px;border-radius:50%;background:#2a2a2e;display:grid;place-items:center}
.prev button .i{width:14px;height:14px}
.b img{display:block;max-width:100%;max-height:260px;border-radius:12px;margin-bottom:6px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:#0c0c0f;border-right:1px solid #1d1d20;z-index:21;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .22s ease;padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))}
aside.open{transform:none}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh b{font-size:20px;font-weight:800;letter-spacing:-.3px;padding-left:4px}
.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:99px;background:var(--y);color:#000;font-weight:700;font-size:15.5px}
.sq{width:100%;height:40px;border-radius:99px;background:var(--card);border:1px solid #232327;color:#fff;font:inherit;font-size:15px;padding:0 14px;margin:10px 0 8px}
.sq::placeholder{color:#6e6e73}
#chats{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#222 transparent}
.ci{display:flex;align-items:center;border-radius:14px;margin-bottom:2px}
.ci:hover,.ci.on{background:#18181c}
.ci.on .co b{color:var(--y)}
.co{flex:1;min-width:0;text-align:left;padding:10px 8px 10px 12px}
.co b,.co small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co b{font-size:14.5px;font-weight:600}
.co small{font-size:12px;color:var(--mut);margin-top:2px}
.ca{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#8e8e93;flex:none}
.ca:hover,.ca:focus-visible{color:#fff;background:#26262b}
.ca.del:hover{color:#ff6b75}
.ca .i{width:17px;height:17px}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:24px 0}
.sf{border-top:1px solid #1d1d20;padding-top:8px;margin-top:6px}
.sf button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;border-radius:12px;color:#c7c7cc;font-size:14px;text-align:left}
.sf button:active{background:#1c1c1e}
.sf .danger{color:#ff6b75}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
@keyframes pulse{50%{opacity:.35}}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(255,45,61,.6)}100%{box-shadow:0 0 0 16px rgba(255,45,61,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="hbtn" id="menu" aria-label="Chats kholo"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <div class="story"><div class="ring"></div><div class="av">K</div><i class="dot" title="Online"></i></div>
    <div class="who"><b>Kayth AI 👻</b><small id="sub">online</small></div>
    <button class="hbtn" id="newh" aria-label="Nayi chat"><svg class="i" viewBox="0 0 24 24"><path d="M12 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-6M17.5 3.5a2.1 2.1 0 013 3L12 15l-4 1 1-4z"/></svg></button>
    <button class="hbtn" id="clear" aria-label="Clear chat"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
  </header>

  <main id="chat">
    <div class="chip"><i></i>Kayth AI was active now</div>
    <div id="list"></div>
  </main>

  <footer id="foot">
    <div class="prev" id="prev"><img id="pimg" alt="Chuni hui photo"><button id="prem" aria-label="Photo hatao"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="pill">
      <button class="ic" id="gal" aria-label="Gallery"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg></button>
      <input id="msg" type="text" placeholder="Message bhejo..." autocomplete="off" enterkeyhint="send" maxlength="1000">
      <div class="recbar" id="recbar"><i></i><span id="rt">Sun raha hu...</span></div>
    </div>
    <button id="act" aria-label="Hold to record, or send">
      <svg class="i mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
      <svg class="i snd" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
    </button>
  </footer>
</div>
<div class="scrim" id="scrim"></div>
<aside id="side" aria-label="Chats" inert>
  <div class="sh"><b>Chats</b><button class="hbtn" id="sclose" aria-label="Band karo"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <button class="newbtn" id="newc"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
  <input id="q" class="sq" type="search" placeholder="Chats dhundho..." autocomplete="off">
  <div id="chats"></div>
  <div class="sf">
    <button id="export"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Is chat ko export karo</button>
    <button id="delall" class="danger"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>Saari chats delete karo</button>
  </div>
</aside>
<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const chatEl = $('#chat'), list = $('#list'), msg = $('#msg'), foot = $('#foot'), act = $('#act'),
      sub = $('#sub'), recbar = $('#recbar'), rt = $('#rt'), toastEl = $('#toast');
const KEY = 'kayth_chat_v1';
const ICON_SPK = '<svg class="i" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';
const TICK1 = '<svg class="i" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 7"/></svg>';
const TICK2 = '<svg class="i" viewBox="0 0 24 24"><path d="M1.5 12.5l5 5L17 7M10 16.5l1 1L22 7"/></svg>';
const OFFLINE = [
  'Net ne dhoka de diya bhai 📡 connection check kar aur phir bhej!',
  'Server tak pahunch hi nahi paya 😭 thodi der baad try kar.',
  'Arre yaar, beech raste mein message kho gaya 💀 dobara bhej na!'
];
const WELCOME = 'Yo! Kayth AI here 👻 Bol bhai, kya scene hai?';

const SKEY = 'kayth_chats_v2';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const newChatObj = () => ({ id: uid(), title: 'New chat', t: Date.now(), custom: false, msgs: [] });
const titleFrom = msgs => {
  const u = msgs.find(m => m.r === 'user'); if (!u) return '';
  const s = (u.c || '').trim() || '📷 Photo';
  return s.length > 32 ? s.slice(0, 32) + '…' : s;
};
let store = null;
try { store = JSON.parse(localStorage.getItem(SKEY)); } catch (e) {}
if (!store || !Array.isArray(store.chats) || !store.chats.length) {
  const c = newChatObj();
  try { c.msgs = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  c.title = titleFrom(c.msgs) || 'New chat';
  store = { active: c.id, chats: [c] };
}
const cur = () => store.chats.find(c => c.id === store.active) || store.chats[0];
store.active = cur().id;
let chat = cur().msgs, busy = false, pendingImg = null, quiet = false;
const persist = () => { try { localStorage.setItem(SKEY, JSON.stringify({ active: store.active, chats: store.chats.map(c => ({ ...c, msgs: c.msgs.slice(-200).map(({ img, ...m }) => m) })) })); } catch (e) {} };
const save = () => { const c = cur(); if (c.msgs.some(m => m.r === 'user')) { c.t = Date.now(); if (!c.custom) c.title = titleFrom(c.msgs); } persist(); };
const clock = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random() * a.length)];
const toBottom = () => chatEl.scrollTo({ top: chatEl.scrollHeight, behavior: 'smooth' });

let toastT;
function toast(t) { toastEl.textContent = t; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2400); }

/* ---------- render ---------- */
function setTicks(el, s) { el.className = 'tk ' + s; el.innerHTML = s === 'sent' ? TICK1 : TICK2; }

function add(m, state) {
  const ai = m.r === 'assistant';
  const row = document.createElement('div');
  row.className = 'row ' + (ai ? 'ai' : 'user');
  const b = document.createElement('div'); b.className = 'b';
  const t = document.createElement('div'); t.className = 't'; t.textContent = m.c;
  const meta = document.createElement('div'); meta.className = 'meta';
  if (m.p) {
    if (m.img) { const im = document.createElement('img'); im.src = m.img; im.alt = 'Photo'; b.append(im); }
    else if (!m.c) t.textContent = '📷 Photo';
  }
  b.append(t, meta);
  let tk = null;
  if (ai) {
    const s = document.createElement('button');
    s.className = 'spk'; s.innerHTML = ICON_SPK; s.setAttribute('aria-label', 'Reply sunao');
    s.onclick = () => speak(m.c, s);
    const time = document.createElement('span'); time.textContent = clock(m.t);
    meta.append(s, time);
  } else {
    const time = document.createElement('span'); time.textContent = clock(m.t);
    tk = document.createElement('span'); setTicks(tk, state || 'seen');
    meta.append(time, tk);
  }
  row.append(b); list.append(row); if (!quiet) toBottom();
  return tk;
}

function showTyping(on) {
  let el = $('#typing');
  document.body.classList.toggle('busy', on);
  sub.textContent = on ? 'typing...' : 'online'; sub.classList.toggle('on', on);
  if (on && !el) {
    el = document.createElement('div'); el.id = 'typing'; el.className = 'row ai typing';
    el.innerHTML = '<div class="b"><div class="dots"><i></i><i></i><i></i></div>Kayth AI is typing...</div>';
    list.append(el); toBottom();
  } else if (!on && el) el.remove();
}

/* ---------- send ---------- */
async function send(text) {
  text = (text || '').trim();
  const image = pendingImg;
  if ((!text && !image) || busy) return;
  busy = true; msg.value = ''; clearImg(); stopSpeak();
  const history = chat.slice(-10).map(m => ({ role: m.r, content: m.c || (m.p ? '[photo bheji]' : '') })).filter(m => m.content);
  const um = { r: 'user', c: text, t: Date.now(), p: !!image, img: image };
  chat.push(um); const tk = add(um, 'sent'); save();
  setTimeout(() => setTicks(tk, 'delivered'), 350);
  showTyping(true);
  const seenT = setTimeout(() => setTicks(tk, 'seen'), 900);

  let reply = '';
  try {
    const res = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, history, image }) });
    const d = await res.json(); reply = d.reply || '';
    if (d.err) console.warn('Kayth AI error:', d.err);
  } catch (e) {}
  clearTimeout(seenT); setTicks(tk, 'seen');
  if (!reply) reply = pick(OFFLINE);
  showTyping(false);
  const am = { r: 'assistant', c: reply, t: Date.now() };
  chat.push(am); add(am); save(); busy = false;
}

msg.addEventListener('input', sync);
msg.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); send(msg.value); } });
function sync() { foot.classList.toggle('has', !!msg.value.trim() || !!pendingImg); }

/* ---------- text to speech ---------- */
function stopSpeak() { if ('speechSynthesis' in window) speechSynthesis.cancel(); document.querySelectorAll('.spk.on').forEach(b => b.classList.remove('on')); }
function speak(text, btn) {
  if (!('speechSynthesis' in window)) return toast('Is browser mein speaker support nahi hai');
  if (btn.classList.contains('on')) return stopSpeak();
  stopSpeak();
  const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\uFE0F]/gu, ''));
  u.lang = 'hi-IN';
  const v = speechSynthesis.getVoices().find(x => x.lang === 'hi-IN') || speechSynthesis.getVoices().find(x => x.lang === 'en-IN');
  if (v) u.voice = v;
  u.onend = u.onerror = () => btn.classList.remove('on');
  btn.classList.add('on'); speechSynthesis.speak(u);
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();

/* ---------- voice (hold to record) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let sess = null, startX = 0;

function setRec(on) { act.classList.toggle('rec', on); recbar.classList.toggle('show', on); recbar.classList.remove('cancel'); if (on) rt.textContent = 'Sun raha hu... bolo'; }

function startRec(x) {
  if (busy) return;
  if (!SR) return toast('Voice ke liye Chrome ya Edge use karo');
  stopSpeak();
  const r = new SR();
  const s = sess = { r, text: '', cancelled: false, t0: Date.now(), live: true };
  r.lang = 'hi-IN'; r.continuous = true; r.interimResults = true;
  r.onresult = e => {
    let t = ''; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    s.text = t; if (!s.cancelled) rt.textContent = t || 'Sun raha hu... bolo';
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('Mic permission allow karo');
    else if (e.error === 'network') toast('Voice ke liye internet chahiye');
    else if (e.error !== 'no-speech' && e.error !== 'aborted') toast('Voice error: ' + e.error);
    s.cancelled = true;
  };
  r.onend = () => {
    if (s.live) { s.live = false; setRec(false); }
    const t = s.text.trim();
    if (s.cancelled) return;
    if (t) send(t); else toast('Kuch suna nahi, phir se bol 🎙️');
  };
  startX = x;
  try { r.start(); setRec(true); } catch (e) { toast('Mic start nahi hua, dobara try kar'); }
}

function stopRec() {
  const s = sess; if (!s || !s.live) return;
  s.live = false; setRec(false);
  if (Date.now() - s.t0 < 450) { s.cancelled = true; toast('Mic ko hold karke bolo 🎙️'); }
  try { s.cancelled ? s.r.abort() : s.r.stop(); } catch (e) {}
}

act.addEventListener('pointerdown', e => {
  if (msg.value.trim() || pendingImg) return;
  e.preventDefault(); act.setPointerCapture(e.pointerId); startRec(e.clientX);
});
act.addEventListener('pointermove', e => {
  const s = sess; if (!s || !s.live) return;
  s.cancelled = startX - e.clientX > 90;
  recbar.classList.toggle('cancel', s.cancelled);
  if (s.cancelled) rt.textContent = 'Chhodo to cancel ho jayega';
  else rt.textContent = s.text || 'Sun raha hu... bolo';
});
act.addEventListener('pointerup', stopRec);
act.addEventListener('pointercancel', stopRec);
act.addEventListener('contextmenu', e => e.preventDefault());
act.addEventListener('click', () => { if (msg.value.trim() || pendingImg) send(msg.value); });

/* ---------- misc ---------- */
const file = $('#file'), prev = $('#prev'), pimg = $('#pimg');
function clearImg() { pendingImg = null; prev.classList.remove('show'); file.value = ''; sync(); }
$('#prem').addEventListener('click', clearImg);
$('#gal').addEventListener('click', () => file.click());
file.addEventListener('change', () => {
  const f = file.files[0]; if (!f) return;
  if (!f.type.startsWith('image/')) return toast('Sirf photo choose karo 📸');
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const sc = Math.min(1, 1024 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    pendingImg = c.toDataURL('image/jpeg', 0.8); URL.revokeObjectURL(url);
    pimg.src = pendingImg; prev.classList.add('show'); sync(); msg.focus();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Ye photo khul nahi payi 😅'); };
  img.src = url;
});
const ICON_EDIT = '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16z"/></svg>';
const ICON_DEL = '<svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
const side = $('#side'), scrim = $('#scrim'), qEl = $('#q'), box = $('#chats');
const guardBusy = () => { if (busy) { toast('Pehle reply aane do, phir chat badlo ⏳'); return true; } return false; };
const snip = c => {
  if (!c.msgs.some(m => m.r === 'user')) return 'Abhi kuch nahi bheja';
  const m = [...c.msgs].reverse().find(x => x.c); if (!m) return '📷 Photo';
  return m.c.length > 38 ? m.c.slice(0, 38) + '…' : m.c;
};

function openSide() { renderSide(); side.inert = false; side.classList.add('open'); scrim.classList.add('show'); }
function closeSide() { side.classList.remove('open'); scrim.classList.remove('show'); side.inert = true; }

function renderChat() {
  stopSpeak(); list.innerHTML = ''; quiet = true;
  chat.forEach(m => add(m)); quiet = false;
  if (!chat.length) welcome();
  chatEl.scrollTo({ top: chatEl.scrollHeight });
}

function renderSide() {
  const q = qEl.value.trim().toLowerCase();
  const items = [...store.chats].sort((a, b) => b.t - a.t)
    .filter(c => !q || c.title.toLowerCase().includes(q) || c.msgs.some(m => (m.c || '').toLowerCase().includes(q)));
  box.innerHTML = '';
  if (!items.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Koi chat nahi mili'; box.append(p); return; }
  items.forEach(c => {
    const el = document.createElement('div'); el.className = 'ci' + (c.id === store.active ? ' on' : '');
    const o = document.createElement('button'); o.className = 'co';
    const b = document.createElement('b'); b.textContent = c.title;
    const s = document.createElement('small'); s.textContent = snip(c);
    o.append(b, s); o.onclick = () => openChat(c.id);
    const r = document.createElement('button'); r.className = 'ca'; r.innerHTML = ICON_EDIT; r.setAttribute('aria-label', 'Naam badlo'); r.onclick = () => renameChat(c.id);
    const d = document.createElement('button'); d.className = 'ca del'; d.innerHTML = ICON_DEL; d.setAttribute('aria-label', 'Chat delete karo'); d.onclick = () => delChat(c.id);
    el.append(o, r, d); box.append(el);
  });
}

function openChat(id) {
  if (id === store.active) return closeSide();
  if (guardBusy()) return;
  store.active = id; chat = cur().msgs; clearImg(); renderChat(); persist(); renderSide(); closeSide();
}

function newChat() {
  if (guardBusy()) return;
  if (!chat.some(m => m.r === 'user')) { closeSide(); toast('Ye already naya chat hai ✨'); msg.focus(); return; }
  const c = newChatObj(); store.chats.push(c); store.active = c.id; chat = c.msgs;
  clearImg(); renderChat(); persist(); renderSide(); closeSide(); msg.focus();
}

function renameChat(id) {
  const c = store.chats.find(x => x.id === id); if (!c) return;
  const n = prompt('Chat ka naya naam (khali chhodo to auto naam):', c.title); if (n === null) return;
  const v = n.trim().slice(0, 40);
  if (v) { c.title = v; c.custom = true; } else { c.custom = false; c.title = titleFrom(c.msgs) || 'New chat'; }
  persist(); renderSide();
}

function delChat(id) {
  const c = store.chats.find(x => x.id === id); if (!c) return;
  if (id === store.active && guardBusy()) return;
  if (!confirm('"' + c.title + '" delete kar du?')) return;
  store.chats = store.chats.filter(x => x.id !== id);
  if (!store.chats.length) store.chats.push(newChatObj());
  if (id === store.active) {
    store.active = [...store.chats].sort((a, b) => b.t - a.t)[0].id; chat = cur().msgs; clearImg(); renderChat();
  }
  persist(); renderSide();
}

$('#menu').addEventListener('click', openSide);
$('#sclose').addEventListener('click', closeSide);
scrim.addEventListener('click', closeSide);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSide(); });
$('#newh').addEventListener('click', newChat);
$('#newc').addEventListener('click', newChat);
qEl.addEventListener('input', renderSide);

$('#clear').addEventListener('click', () => {
  if (guardBusy() || !confirm('Is chat ke saare messages clear kar du?')) return;
  const c = cur(); c.msgs = chat = []; c.custom = false; c.title = 'New chat';
  clearImg(); renderChat(); persist(); renderSide();
});

$('#delall').addEventListener('click', () => {
  if (guardBusy() || !confirm('Saari chats delete kar du? Ye wapas nahi aayengi.')) return;
  const c = newChatObj(); store = { active: c.id, chats: [c] }; chat = c.msgs;
  clearImg(); renderChat(); persist(); renderSide(); closeSide();
});

$('#export').addEventListener('click', () => {
  if (!chat.length) return toast('Export karne ko kuch nahi hai');
  const text = chat.map(m => '[' + clock(m.t) + '] ' + (m.r === 'user' ? 'Tum' : 'Kayth AI') + ': ' + (m.c || '📷 Photo')).join('\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  a.download = (cur().title.replace(/[^\w\- ]+/g, '').trim().slice(0, 30) || 'kayth-chat') + '.txt';
  a.click(); URL.revokeObjectURL(a.href);
});

function welcome() { const m = { r: 'assistant', c: WELCOME, t: Date.now() }; chat.push(m); add(m); save(); }

renderChat(); renderSide();
setTimeout(() => chatEl.scrollTo({ top: chatEl.scrollHeight }), 50);
</script>
</body>
</html>
