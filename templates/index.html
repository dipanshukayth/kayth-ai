<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayth AI</title>
<style>
body{background:#000;color:#fff;font-family:system-ui;margin:0;display:flex;flex-direction:column;height:100vh}
.header{padding:15px;font-weight:bold;font-size:20px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;border-bottom:1px solid #222}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.user{align-self:flex-end;background:linear-gradient(45deg,#feda75,#d62976);color:#fff;padding:10px 15px;border-radius:18px 18px 0 18px;max-width:75%}
.ai{align-self:flex-start;background:#262626;padding:10px 15px;border-radius:18px 18px 18px 0;max-width:75%}
.input-area{display:flex;padding:10px;background:#121212;gap:10px;border-top:1px solid #262626}
input{flex:1;background:#262626;border:none;border-radius:20px;padding:12px 15px;color:#fff;outline:none}
button{background:linear-gradient(45deg,#fa7e1e,#d62976);border:none;border-radius:50%;width:45px;height:45px;color:#fff;font-size:20px}
</style>
</head>
<body>
<div class="header">Kayth AI ✨</div>
<div id="chat"></div>
<div class="input-area">
<input id="msg" placeholder="Message...">
<button onclick="send()">↑</button>
</div>
<script>
async function send(){
 let m=document.getElementById('msg').value;
 if(!m)return;
 let c=document.getElementById('chat');
 c.innerHTML+=`<div class="user">${m}</div>`;
 document.getElementById('msg').value='';
 let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
 let d=await r.json();
 c.innerHTML+=`<div class="ai">${d.reply}</div>`;
 c.scrollTop=c.scrollHeight;
}
</script>
</body>
</html>
