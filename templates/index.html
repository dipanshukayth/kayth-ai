<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kayth AI</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column}.top{padding:14px;border-bottom:1px solid #222;font-weight:900;font-size:22px}#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}.user{align-self:flex-end;background:#FFFC00;color:#000;font-weight:700;padding:12px 16px;border-radius:20px 20px 0 20px;max-width:75%}.ai{align-self:flex-start;background:#262626;padding:12px 16px;border-radius:20px 20px 20px 0;max-width:80%;border:1px solid #333}.input-wrap{padding:10px;background:#121212;display:flex;gap:8px}.input-wrap input{flex:1;background:#262626;border:none;border-radius:25px;padding:14px 18px;color:#fff;outline:none}button{width:50px;height:50px;border-radius:50%;border:none;background:yellow;font-weight:900}</style></head><body><div class="top">Kayth AI by Dipanshu</div><div id="chat"><div class="ai">Yo! Main Kayth AI hu, Dipanshu ne banaya hai. Pucho kuch bhi! 🚀</div></div><div class="input-wrap"><input id="msg" placeholder="Message..."><button onclick="send()">></button></div><script>const chatDiv=document.getElementById('chat');async function send(){let input=document.getElementById('msg');let m=input.value.trim();if(!m)return;chatDiv.innerHTML+=`<div class="user">${m}</div>`;input.value='';let tid=Date.now();chatDiv.innerHTML+=`<div class="ai" id="${tid}">typing...</div>`;chatDiv.scrollTop=chatDiv.scrollHeight;try{let res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});let data=await res.json();document.getElementById(tid).innerHTML=data.reply;}catch(e){document.getElementById(tid).innerHTML="Error boss, fir se bolo 😅";}chatDiv.scrollTop=chatDiv.scrollHeight;}document.getElementById('msg').addEventListener('keypress',e=>{if(e.key==='Enter')send()});</script></body></html>
