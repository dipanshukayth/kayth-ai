<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayth AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column}
.top{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a}
.logo{font-size:22px;font-weight:900} .logo span{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.story-bar{display:flex;gap:12px;padding:10px 15px;overflow-x:auto;border-bottom:1px solid #1a1a1a}
.story{width:56px;height:56px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf);padding:2px;flex-shrink:0}
.story-inner{width:100%;height:100%;background:#000;border-radius:50%;display:flex;align-items:center;justify-content:center}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.user{align-self:flex-end;background:#FFFC00;color:#000;font-weight:600;padding:12px 16px;border-radius:20px 20px 0 20px;max-width:75%}
.ai{align-self:flex-start;background:#262626;color:#fff;padding:12px 16px;border-radius:20px 20px 20px 0;max-width:78%;border:1px solid #333;position:relative}
.input-wrap{padding:10px;background:#121212;display:flex;align-items:center;gap:8px;border-top:1px solid #262626}
.input-wrap input{flex:1;background:#262626;border:none;border-radius:25px;padding:13px 18px;color:#fff;outline:none}
.icon-btn{width:44px;height:44px;border-radius:50%;border:none;background:#262626;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.send-btn{width:48px;height:48px;border-radius:50%;border:none;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf);color:#fff;font-size:18px}
.mic-active{background:#FF3B30 !important;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.speak{font-size:12px;color:#aaa;margin-top:5px;cursor:pointer}
</style>
</head>
<body>
<div class="top"><div class="logo"><span>Kayth AI</span> 👻</div><i class="fa-solid fa-video"></i></div>
<div class="story-bar">
<div class="story"><div class="story-inner">🤖</div></div>
<div class="story"><div class="story-inner">✨</div></div>
<div class="story"><div class="story-inner">🎙️</div></div>
</div>
<div id="chat"><div class="ai">Yo! Main Kayth AI hu, Dipanshu Kayth ne banaya hai mujhe. Bolo kya kaam hai? 🎤 dabake bol bhi sakte ho!</div></div>
<div class="input-wrap">
<button class="icon-btn" id="micBtn" onclick="startVoice()"><i class="fa-solid fa-microphone"></i></button>
<input id="msg" placeholder="Message...">
<button class="icon-btn" onclick="speakLast()"><i class="fa-solid fa-volume-high"></i></button>
<button class="send-btn" onclick="send()"><i class="fa-solid fa-paper-plane"></i></button>
</div>
<script>
let lastAIText = "";
const chatDiv = document.getElementById('chat');

async function send(){
 let input=document.getElementById('msg'); let m=input.value.trim(); if(!m)return;
 chatDiv.innerHTML+=`<div class="user">${m}</div>`; input.value=''; chatDiv.scrollTop=chatDiv.scrollHeight;
 chatDiv.innerHTML+=`<div class="ai" id="typing">typing...</div>`; chatDiv.scrollTop=chatDiv.scrollHeight;
 let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
 let d=await r.json(); document.getElementById('typing').remove();
 lastAIText = d.reply;
 chatDiv.innerHTML+=`<div class="ai">${d.reply}<div class="speak" onclick="speakText('${d.reply.replace(/'/g,"")}')">🔊 Suno</div></div>`;
 chatDiv.scrollTop=chatDiv.scrollHeight;
 speakText(d.reply);
}
function speakText(t){
 speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(t); u.lang='hi-IN'; u.rate=1; speechSynthesis.speak(u);
}
function speakLast(){ if(lastAIText) speakText(lastAIText); }

function startVoice(){
 let btn=document.getElementById('micBtn');
 let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
 if(!SpeechRecognition){alert("Voice is not supported in this browser, Chrome me khol");return;}
 let rec=new SpeechRecognition(); rec.lang='hi-IN'; rec.start();
 btn.classList.add('mic-active');
 rec.onresult=(e)=>{document.getElementById('msg').value=e.results[0][0].transcript; btn.classList.remove('mic-active'); send();}
 rec.onerror=()=>btn.classList.remove('mic-active');
 rec.onend=()=>btn.classList.remove('mic-active');
}
document.getElementById('msg').addEventListener('keypress',e=>{if(e.key==='Enter')send()})
</script>
</body>
</html>
